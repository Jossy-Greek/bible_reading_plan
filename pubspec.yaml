name: bible_reading_plan
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  # Plus Jakarta Sans, bundled so the app stays offline. Variable fonts: the
  # single file carries every weight, Flutter picks the axis from FontWeight.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-VF.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-VF.ttf
          style: italic
